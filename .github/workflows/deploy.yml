name: Test and deploy static site

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-browser.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: pip install -r requirements-browser.txt
      - run: python scripts/build.py
      - run: python -m unittest discover -s tests -v

      - name: Check JavaScript syntax
        run: |
          for file in assets/js/*.js; do node --input-type=module --check < "$file"; done

      - run: python -m playwright install --with-deps chromium
      - name: Test staged site under the Pages project path
        run: python tests/browser_smoke.py
        env:
          PRIVACY_SITE_ROOT: _site

      - uses: actions/upload-pages-artifact@v3
        if: github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request'
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
